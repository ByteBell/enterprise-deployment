global
    log stdout format raw local0
    maxconn 4096
    nbthread 4
    # Names this process in `peers sticky` below; must match its one `peer` line.
    localpeer haproxy

# A stick-table lives in the process that filled it, so a reload (USR2) starts with it empty unless a
# peer hands it over. One local peer is enough: on reload the old worker pushes its tables to the new
# one. Without it, every live public-agent run loses its pin to the replica running it — see
# `backend public_agent`. A container restart still empties the table; the service answers a misrouted
# read for a live run itself (`findOwnedRun` in public-agent), so a pin is an optimisation, not a must.
peers sticky
    peer haproxy 127.0.0.1:10000

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout tunnel  3600s

# Runtime DNS via Docker's embedded resolver (127.0.0.11).
# Without this HAProxy resolves backend hostnames once at startup and caches the
# IPs forever; when an update recreates containers they get new IPs and HAProxy
# keeps routing to the dead ones (-> <NOSRV> 503 "Offline").
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry  1s
    hold valid    10s
    hold other    10s
    hold refused  10s
    hold nx       10s
    hold timeout  10s
    hold obsolete 10s

# Stats page at :8404/stats
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s

# Main frontend — route-based
frontend fe_http
    bind *:80

    acl is_admin_api path_beg /api
    # The public repo page's question runner — its own service, replicated. Matched on a prefix that
    # cannot collide with the public-repo gateway's own /api/v1/public/repos/* routes (docs, questions,
    # catalog), which stay on admin-server.
    acl is_public_agent path_beg /api/v1/public/agent
    acl is_pdf_ingest path_beg /api/v1/knowledge/pdf
    acl is_knowledge path_beg /knowledge
    acl is_mcp path_beg /mcp
    # Only the provider feedback webhooks are exposed publicly; the send endpoints stay internal
    # (admin-server reaches email-dispatcher directly on the docker network).
    acl is_resend_events path_beg /v1/webhooks/resend
    acl is_ses_events path_beg /v1/ses/events

    # BEFORE is_admin_api — that ACL is `path_beg /api` and would otherwise swallow this one.
    use_backend public_agent if is_public_agent
    use_backend admin_api_long if is_pdf_ingest
    use_backend admin_api if is_admin_api
    use_backend knowledge_api if is_knowledge
    use_backend mcp_server if is_mcp
    use_backend email_dispatcher if is_resend_events
    use_backend email_dispatcher if is_ses_events
    default_backend admin_dashboard

# ===================
# Backends
# ===================

backend admin_dashboard
    errorfile 503 /etc/haproxy/errors/503.http
    server admin_ui admin-dashboard:80 check resolvers docker init-addr last,libc,none resolve-prefer ipv4

backend admin_api
    # ELB health check probes /api/admin/health; admin-server's single health route is /health.
    # Map the probe to it here so the app keeps one health endpoint as the source of truth.
    http-request set-path /health if { path /api/admin/health }
    errorfile 503 /etc/haproxy/errors/503.http
    server admin1 admin-server:3002 check resolvers docker init-addr last,libc,none resolve-prefer ipv4

backend admin_api_long
    timeout server 300s
    timeout tunnel 3600s
    errorfile 503 /etc/haproxy/errors/503.http
    server admin1 admin-server:3002 check resolvers docker init-addr last,libc,none resolve-prefer ipv4

# The public question runner. New runs round-robin across replicas; each run is then PINNED to the
# replica running it, because a run's state (trace, status, cancel) lives in that replica's memory
# (`services/public-agent/src/run-store.ts`). The start response carries `X-Run-Id`; the stick-table
# stores it against the replica that answered, and every `/runs/pa_…` path — stream, result, cancel,
# under either prefix — is looked up by that id. The pin only has to outlive a LIVE run: once a run
# ends it leaves memory and every replica serves it from its Mongo row. `expire 1h` is well past the
# longest run, and each request for the run refreshes it. `saved_…` replay ids are not pinned: any
# replica can serve them. `option redispatch`: a run pinned to a replica that is down is gone anyway,
# and the other replica's clean 404 beats a 503 the page keeps retrying.
#
# `timeout server 600s` because these responses are SSE and stay open for the length of a run. The
# service heartbeats every 15s, which is what keeps it inside the 30s `timeout client` from defaults —
# if that heartbeat interval is ever raised, raise `timeout client` here with it or traces will be cut
# mid-run and a dropped socket is indistinguishable from a finished one.
backend public_agent
    balance roundrobin
    timeout server 600s
    timeout tunnel 3600s
    errorfile 503 /etc/haproxy/errors/503.http
    option redispatch
    stick-table type string len 64 size 100k expire 1h peers sticky
    # /api/v1/public/agent/runs/<id>…                → field 7 of the path split on "/"
    # /api/v1/public/agent/repos/<o>/<r>/runs/<id>…  → field 10
    acl run_path      path_reg ^/api/v1/public/agent/runs/pa_[0-9a-f]+(/|$)
    acl repo_run_path path_reg ^/api/v1/public/agent/repos/[^/]+/[^/]+/runs/pa_[0-9a-f]+(/|$)
    stick on path,field(7,/) if run_path
    stick on path,field(10,/) if repo_run_path
    stick store-response res.hdr(x-run-id)
    server pubagent1 public-agent-1:3200 check resolvers docker init-addr last,libc,none resolve-prefer ipv4
    server pubagent2 public-agent-2:3200 check resolvers docker init-addr last,libc,none resolve-prefer ipv4

backend knowledge_api
    balance roundrobin
    # install.sh probes /knowledge/health; knowledge-server's single health route is /health.
    # Same mapping as admin_api's, so the app keeps one health endpoint.
    http-request set-path /health if { path /knowledge/health }
    errorfile 503 /etc/haproxy/errors/503.http
    # ONE knowledge-server in this deployment. Three more were listed here, copied from a
    # development compose that scales it to four; they resolved to nothing and were disabled at
    # boot with a NOTICE on every start. Add a server line here only when you add the container.
    server knowledge1 knowledge-server:3001 check resolvers docker init-addr last,libc,none resolve-prefer ipv4

backend email_dispatcher
    # Public route for the SES→SNS feedback webhook only (POST /v1/ses/events). Send endpoints are
    # reached internally on the docker network and are not routed here.
    errorfile 503 /etc/haproxy/errors/503.http
    server email1 email-dispatcher:3005 check resolvers docker init-addr last,libc,none resolve-prefer ipv4

backend mcp_server
    balance roundrobin
    timeout server 600s
    timeout tunnel 3600s
    errorfile 503 /etc/haproxy/errors/503.http
    # Sticky sessions: route requests with same mcp-session-id to same backend.
    # `expire` must be >= the server's MCP_SESSION_IDLE_TIMEOUT_MS (default 6h): sessions live in
    # one replica's memory, so a shorter expiry reroutes a still-live idle session to a replica
    # that 404s it, and the client re-initializes with an empty per-session budget ledger.
    stick-table type string len 64 size 100k expire 6h
    stick on req.hdr(mcp-session-id)
    stick store-response res.hdr(mcp-session-id)
    server mcp1 mcp-server-1:3100 check resolvers docker init-addr last,libc,none resolve-prefer ipv4
    server mcp2 mcp-server-2:3100 check resolvers docker init-addr last,libc,none resolve-prefer ipv4
    server mcp3 mcp-server-3:3100 check resolvers docker init-addr last,libc,none resolve-prefer ipv4
    server mcp4 mcp-server-4:3100 check resolvers docker init-addr last,libc,none resolve-prefer ipv4
